# Doc 3 Bloque 5 / Doc 7 Bloque 4 — Integración continua de la app. Corre en
# cada Pull Request y en cada push a main: formato, análisis estático y tests.
# Además, en main, un APK de staging para instalar en un teléfono de prueba
# (docs/guia-validacion-telefono.md). El build del AAB y la distribución a
# Google Play son manuales y van aparte (Doc 3: nunca automáticos).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Formato, análisis y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Misma versión que el entorno de desarrollo, fijada a propósito.
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # Los *.g.dart no se versionan: se generan acá, como en local.
      - name: Generar código (Riverpod)
        run: dart run build_runner build -d

      - name: Formato (sin autocorregir)
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Análisis estático
        run: flutter analyze --fatal-infos

      - name: Tests
        run: flutter test

  # APK de staging: release apuntando al backend de Railway, firmado con la
  # clave de debug fija (su SHA-1 está registrado en Firebase; NO es la clave
  # de Google Play). Se salta hasta que existan la variable y los secretos.
  apk-staging:
    name: APK de staging
    needs: calidad
    if: github.event_name != 'pull_request' && vars.API_URL_STAGING != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      # Los secretos se escriben fuera del repo o en rutas ignoradas por git,
      # y el runner se descarta al terminar.
      - name: Inyectar Firebase y la clave de firma
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_BASE64" || { echo "Falta el secreto GOOGLE_SERVICES_JSON_BASE64"; exit 1; }
          test -n "$DEBUG_KEYSTORE_BASE64" || { echo "Falta el secreto DEBUG_KEYSTORE_BASE64"; exit 1; }
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Instalar dependencias
        run: flutter pub get

      - name: Generar código (Riverpod)
        run: dart run build_runner build -d

      - name: Compilar APK
        env:
          API_URL: ${{ vars.API_URL_STAGING }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          args=(--release --dart-define=API_URL="$API_URL")
          if [ -n "$GOOGLE_WEB_CLIENT_ID" ]; then
            args+=(--dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID")
          fi
          flutter build apk "${args[@]}" --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: gestor-encargos-staging-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
