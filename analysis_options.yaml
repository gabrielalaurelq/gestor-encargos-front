# Doc 7, Bloque 4: `flutter_lints` estándar — reglas más agresivas añadirían
# fricción sin beneficio proporcional en un equipo chico. Solo se agregan las
# que evitan errores reales, no las de estilo.
include: package:flutter_lints/flutter.yaml

formatter:
  # Mismo ancho que Prettier en el backend.
  page_width: 100

analyzer:
  exclude:
    - "**/*.g.dart"
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    prefer_single_quotes: true
    always_declare_return_types: true
    unawaited_futures: true
